name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  release:
    if: github.repository == 'adtstack/kaos'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release commit belongs to public main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          RELEASE_SHA=$(git rev-parse "${GITHUB_REF}^{commit}")
          if ! git merge-base --is-ancestor "$RELEASE_SHA" origin/main; then
            echo "::error::Release tags must point to a commit on adtstack/kaos main"
            exit 1
          fi

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm ci --prefix server
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --prefix server --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run build
      - run: npm run build:headless:host
      - run: npm run prepare:headless-host-oracle-upload
      - run: npm run build:server-release
      - run: npm run test:ci:release
      - run: npm run test:coverage:critical
      - run: npm run test:integration:headless-host
      - run: npm --prefix server run typecheck

      - name: Verify tag matches manifest version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          REGISTERED_VERSION=$(node -p "Object.prototype.hasOwnProperty.call(require('./versions.json'), '$TAG')")
          if [ "$TAG" != "$MANIFEST_VERSION" ] || [ "$TAG" != "$PACKAGE_VERSION" ]; then
            echo "::error::Tag ($TAG), manifest ($MANIFEST_VERSION), and package ($PACKAGE_VERSION) must match"
            exit 1
          fi
          if [ "$REGISTERED_VERSION" != "true" ]; then
            echo "::error::versions.json does not register $TAG"
            exit 1
          fi

      - name: Stage verified release assets
        run: |
          set -euo pipefail
          ASSET_DIR="${RUNNER_TEMP}/release-assets"
          mkdir -p "${ASSET_DIR}"
          zip "${ASSET_DIR}/kaos.zip" main.js telemetry.js manifest.json styles.css
          cp \
            dist/release-assets/kaos-server.zip \
            dist/release-assets/update-manifest.json \
            dist/kaos-headless-host.mjs \
            dist/kaos-headless-host.mjs.sha256 \
            dist/kaos-headless-host-manifest.json \
            dist/kaosctl.mjs \
            dist/kaosctl.mjs.sha256 \
            dist/kaos-headless-user-manifest.json \
            dist/kaos-headless-user.zip \
            dist/kaos-headless-user.zip.sha256 \
            dist/kaos-plugin.zip \
            dist/kaos-plugin.zip.sha256 \
            dist/kaos-headless-host-oracle.zip \
            dist/kaos-headless-host-oracle.zip.sha256 \
            deploy/kaos-headless-host.service \
            deploy/kaos-headless-host.user.service \
            deploy/oracle-acceptance-config.example.json \
            scripts/install.sh \
            scripts/bootstrap-headless-host-oracle.mjs \
            scripts/install-headless-host.mjs \
            scripts/uninstall-headless-host.mjs \
            scripts/update-headless-host-from-release.mjs \
            scripts/verify-headless-host-bundle.mjs \
            scripts/validate-headless-host-release-assets.mjs \
            scripts/run-headless-host-oracle-rehearsal.mjs \
            scripts/run-headless-host-oracle-remote-rehearsal.mjs \
            scripts/run-headless-host-oracle-acceptance.mjs \
            scripts/verify-headless-host-oracle-acceptance.mjs \
            scripts/verify-headless-host-oracle-rehearsal.mjs \
            scripts/smoke-headless-host-sync.mjs \
            scripts/postflight-headless-host.mjs \
            scripts/rollback-headless-host.mjs \
            main.js \
            telemetry.js \
            manifest.json \
            styles.css \
            "${ASSET_DIR}/"

      - name: Upload verified release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets-${{ github.ref_name }}
          path: ${{ runner.temp }}/release-assets
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish verified release
    needs: release
    if: github.repository == 'adtstack/kaos'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    environment: public-release
    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets-${{ github.ref_name }}
          path: release-assets

      - name: Create immutable release
        working-directory: release-assets
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          ASSETS=(./*)
          if [[ "${#ASSETS[@]}" -ne 37 ]]; then
            echo "::error::Expected 37 verified release assets, found ${#ASSETS[@]}"
            exit 1
          fi

          LOCAL_MANIFEST="${RUNNER_TEMP}/release-assets.local.tsv"
          REMOTE_MANIFEST="${RUNNER_TEMP}/release-assets.remote.tsv"
          for asset in "${ASSETS[@]}"; do
            printf '%s\tsha256:%s\n' "$(basename "${asset}")" "$(sha256sum "${asset}" | cut -d' ' -f1)"
          done | LC_ALL=C sort > "${LOCAL_MANIFEST}"

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh api "repos/${GH_REPO}/releases/tags/${GITHUB_REF_NAME}" \
              --jq '.assets[] | [.name, .digest] | @tsv' | LC_ALL=C sort > "${REMOTE_MANIFEST}"
            if cmp --silent "${LOCAL_MANIFEST}" "${REMOTE_MANIFEST}"; then
              echo "Release ${GITHUB_REF_NAME} already contains the exact verified assets."
              exit 0
            fi
            echo "::error::Release ${GITHUB_REF_NAME} already exists with different assets; published assets are immutable."
            diff --unified "${REMOTE_MANIFEST}" "${LOCAL_MANIFEST}" || true
            exit 1
          fi

          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            "${ASSETS[@]}"
