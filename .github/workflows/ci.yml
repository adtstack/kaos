name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm ci --prefix server
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --prefix server --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run build
      - run: npm run build:headless:host
      - run: npm run prepare:headless-host-oracle-upload
      - run: npm run test:ci:release
      - run: npm run test:coverage:critical
      - run: npm run test:integration:headless-host
      - run: npm --prefix server run typecheck
